# config/ros2_control.yaml
# controller_manager configuration for the Loon-E ASV.
#
# Two controllers run inside the controller_manager:
#   * joint_state_broadcaster  - reads the state interfaces and publishes /joint_states
#     (this is what robot_state_publisher uses to place the prop/rudder links in TF).
#   * asv_forward_controller   - a stock ForwardCommandController that forwards the
#     [propeller_l, propeller_r, rudder_l, rudder_r] fractions it receives on
#     /asv_forward_controller/commands straight to the "position" command interfaces.
#
# The thrust_mixer node publishes to /asv_forward_controller/commands; the hardware
# side (topic_based_ros2_control) then relays the command interfaces to the
# busio_node node. See le1000_urdf_t4/urdf/le1000_urdf_t4.urdf.xacro (src/loone_urdf)
# for the interface declarations.
#
# NOTE: the URDF models two independent rudder joints (one per float, twin-float
# catamaran), but the boat has only ONE physical rudder servo. thrust_mixer
# publishes the same rudder fraction into both rudder_l_joint/rudder_r_joint
# slots, and busio_node.py's joint_to_servo maps both names onto that one servo
# object -- they always move together.

controller_manager:
  ros__parameters:
    # TODO(team): match this to how fast you want to push PWM updates. The PCA9685
    # itself refreshes at `freq` Hz (50 by default); 50 Hz here is a sensible start.
    update_rate: 50  # Hz
    use_sim_time: false

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    asv_forward_controller:
      type: forward_command_controller/ForwardCommandController

# ForwardCommandController: the `joints` order here defines the order of the
# Float64MultiArray that thrust_mixer must publish ->
# [propeller_l, propeller_r, rudder_l, rudder_r] (rudder_l == rudder_r).
asv_forward_controller:
  ros__parameters:
    joints:
      - propeller_l_joint
      - propeller_r_joint
      - rudder_l_joint
      - rudder_r_joint
    # Must match the command_interface name in le1000_urdf_t4.urdf.xacro.
    interface_name: position
