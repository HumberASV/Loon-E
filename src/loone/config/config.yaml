# Configurations
/task:
  ros__parameters:
    task: [2.1]
    # GPS course, one entry per waypoint. These must be the same length and
    # non-empty -- task.py raises at startup otherwise.
    latitude: [63.440734, 63.440460]
    longitude: [10.423366, 10.422980]
    error_lat: 0.00001 # Allowed deviation in latitude from GPS point
    error_long: 0.00002 # Allowed deviation in longitude from GPS point
    camera_fov: 40.0 # Expected horizontal distance visible in camera frame, metres
    # ZED object detection topic; follows the camera_name/zed_node_name launch args.
    objects_topic: "/zedx/zed_node/obj_det/objects"
    has_map: False
    has_camera: True
    timer_period: 0.5

/phone:
  ros__parameters:
    phone_port: 5000 # Port on the phone to route to the computer
    computer_port: 5000 # Port on the computer to route to the phone
    host: "127.0.0.1" # Host for the phone node (default is localhost)

/motor:
  ros__parameters:
    timer_period: 0.5 # Timer period in seconds
    i2c: True        # If connection to I2C devices required
    freq: 50          # PCA9685 PWM frequency in Hz
    factor: 0.75      # Initial propeller throttle factor
    center: 0.5      # Rudder center fraction (0 degrees)

    kp: 2.0           # PID proportional gain
    ki: 0.5           # PID integral gain
    kd: 0.02           # PID derivative gain
    max: 90.0         # Max heading error / PID output clamp (degrees)
    diff: 0.2         # Deviation from stationary state (percentage, 0 to 1)

    prop_min: 1120    # Propeller servo min pulse width (µs)
    prop_max: 1880    # Propeller servo max pulse width (µs)
    rudder_min: 1220  # Rudder servo min pulse width (µs)
    rudder_max: 1820  # Rudder servo max pulse width (µs)

/path_planning:
  ros__parameters:
    dist: 4
    radius: 2

/battery_node:
  ros__parameters:
    dw_min: 15.0      # Min voltage of Dewalt battery
    dw_max: 21.0      # Max voltage of Dewalt battery
    br_min: 13.2      # Min voltage of Blue Robotics battery
    br_max: 16.8      # Max voltage of Blue Robotics battery
